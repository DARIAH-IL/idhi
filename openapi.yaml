openapi: 3.1.0

info:
  title: IDHI API
  version: 1.0.0

security:
  - bearerAuth: [ ]

tags:
  - name: Entities
    description: Entity search and management
  - name: UserManagement
    description: User management

paths:
  /api/v1/health:
    get:
      summary: Health check
      security: [ ]
      responses:
        "200":
          description: OK

  /api/v1/entities:
    get:
      tags:
        - Entities
      summary: Search entities
      description: Free text search and facet-based search across all entities. Returns partial entity properties and facets.
      security: [ ]
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Search results with facets
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - facets
                  - total
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditedEntity"
                  facets:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                          - value
                          - count
                        properties:
                          value:
                            type: string
                          count:
                            type: integer
                  total:
                    type: integer
    put:
      tags:
        - Entities
      summary: Create a new entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditedEntity"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{entityId}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags:
        - Entities
      summary: Get an entity
      description: Returns all properties of a specific entity.
      security: [ ]
      responses:
        "200":
          description: Entity found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditedEntity"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Entities
      summary: Update an entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          description: Entity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditedEntity"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Entities
      summary: Delete an entity
      responses:
        "204":
          description: Entity deleted
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      tags:
        - UserManagement
      summary: List users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - total
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - UserManagement
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWrite"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags:
        - UserManagement
      summary: Get a user
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags:
        - UserManagement
      summary: Replace a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWrite"
      responses:
        "200":
          description: User replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - UserManagement
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWrite"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - UserManagement
      summary: Delete a user
      responses:
        "204":
          description: User deleted
        "400":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string

  schemas:
    UserId:
      type: string
      pattern: "^idhi:user:.+$"
      example: "idhi:user:abc123"

    Date:
      type: string
      format: date
      description: UTC date

    Entity:
      oneOf:
        - $ref: "#/components/schemas/Person"
        - $ref: "#/components/schemas/Organization"
        - $ref: "#/components/schemas/Facility"
        - $ref: "#/components/schemas/Project"
        - $ref: "#/components/schemas/Tool"
        - $ref: "#/components/schemas/Service"
        - $ref: "#/components/schemas/Publication"
        - $ref: "#/components/schemas/Event"
        - $ref: "#/components/schemas/Dataset"
      discriminator:
        propertyName: type
        mapping:
          "idhi:Person": "#/components/schemas/Person"
          "idhi:Organization": "#/components/schemas/Organization"
          "idhi:Facility": "#/components/schemas/Facility"
          "idhi:Project": "#/components/schemas/Project"
          "idhi:Tool": "#/components/schemas/Tool"
          "idhi:Service": "#/components/schemas/Service"
          "idhi:Publication": "#/components/schemas/Publication"
          "idhi:Event": "#/components/schemas/Event"
          "idhi:Dataset": "#/components/schemas/Dataset"

    Person:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Person"

    Organization:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Organization"

    Facility:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Facility"

    Project:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Project"

    Tool:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Tool"

    Service:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Service"

    Publication:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Publication"

    Event:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Event"

    Dataset:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Dataset"

    Audited:
      type: object
      properties:
        audit:
          type: object
          required:
            - createdAt
            - createdBy
            - modifiedAt
            - modifiedBy
          properties:
            createdAt:
              $ref: "#/components/schemas/Date"
            createdBy:
              $ref: "#/components/schemas/UserId"
            modifiedAt:
              $ref: "#/components/schemas/Date"
            modifiedBy:
              $ref: "#/components/schemas/UserId"

    AuditedEntity:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - $ref: "#/components/schemas/Audited"

    User:
      type: object
      required:
        - id
        - email
        - isAdmin
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean

    UserWrite:
      type: object
      required:
        - email
        - isAdmin
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean

    ErrorCode:
      type: string
      enum:
        - Unauthorized
        - InvalidInput
        - EntityNotFound
        - UserNotFound
        - Conflict

    Error:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        entityId:
          type: string

  responses:
    Error:
      description: Applicative error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
