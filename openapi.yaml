openapi: 3.1.0

info:
  title: IDHI API
  version: 1.0.0

security:
  - oauth2: [ ]
  - bearerAuth: [ ]

tags:
  - name: Entities
    description: Entity search and management
  - name: UserManagement
    description: User management
  - name: UserInvites
    description: User invite management
  - name: UserAuth
    description: User authentication
  - name: Oauth
    description: OAuth authorization for MCP clients

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      security: [ ]
      responses:
        "200":
          description: OK

  /api/v1/auth/otp:
    post:
      operationId: startOtpChallenge
      tags:
        - UserAuth
      summary: Start an OTP challenge
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthOtpStartWrite"
      responses:
        "200":
          description: OTP challenge started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOtpChallenge"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/otp/{challengeId}:
    parameters:
      - $ref: "#/components/parameters/ChallengeId"
    post:
      operationId: completeOtpChallenge
      tags:
        - UserAuth
      summary: Complete an OTP challenge
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpChallengeCompletion"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/passkey/create:
    post:
      operationId: startPasskeyRegistration
      tags:
        - UserAuth
      summary: Start passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationWrite"
      responses:
        "200":
          description: Passkey registration challenge started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationChallenge"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/passkey/create/{challengeId}:
    parameters:
      - $ref: "#/components/parameters/ChallengeId"
    post:
      operationId: completePasskeyRegistration
      tags:
        - UserAuth
      summary: Complete passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationResponse"
      responses:
        "204":
          description: Passkey registered
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/passkey/login:
    post:
      operationId: startPasskeyAuthentication
      tags:
        - UserAuth
      summary: Start passkey authentication
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailWrite"
      responses:
        "200":
          description: Passkey authentication challenge started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAuthenticationChallenge"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/passkey/login/{challengeId}:
    parameters:
      - $ref: "#/components/parameters/ChallengeId"
    post:
      operationId: completePasskeyAuthentication
      tags:
        - UserAuth
      summary: Complete passkey authentication
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthenticationResponse"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/entities:
    post:
      operationId: searchEntities
      tags:
        - Entities
      summary: Search entities
      description: Free text search and facet-based search across all entities. Returns partial entity properties and facets.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitySearch"
      responses:
        "200":
          description: Search results with facets
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - facets
                  - total
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditedEntity"
                  facets:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                          - value
                          - count
                        properties:
                          value:
                            type: string
                          count:
                            type: integer
                  total:
                    type: integer
                    description: Total number of matching entities across all pages.
    put:
      operationId: createEntity
      tags:
        - Entities
      summary: Create a new entity
      description: Creates an entity with an ID minted by the server. The request ID may be omitted, null, or empty; a non-empty ID is rejected.
      parameters:
        - $ref: "#/components/parameters/IsDraft"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditedEntity"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/entities/tags:
    get:
      operationId: searchEntityTags
      tags:
        - Entities
      summary: Search tag values
      description: Returns distinct tag values used across entities, optionally filtered by a substring, for autocomplete purposes.
      security: [ ]
      parameters:
        - name: q
          in: query
          required: false
          description: Optional case-insensitive substring to filter tag values by.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching tag values
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/v1/entities/suggestions:
    post:
      operationId: suggestEntityFieldValues
      tags:
        - Entities
      summary: Suggest entity field values
      description: Returns AI-generated suggestions for a single supported entity field, derived from the prominent fields of the supplied entity. The entity need not be persisted; its ID is ignored.
      parameters:
        - name: field
          in: query
          required: true
          description: The entity field to suggest values for.
          schema:
            $ref: "#/components/schemas/SuggestibleEntityField"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          description: Suggested values for the requested field
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{entityId}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      operationId: getEntityById
      tags:
        - Entities
      summary: Get an entity
      description: Returns all properties of a specific entity.
      security: [ ]
      responses:
        "200":
          description: Entity found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditedEntity"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: updateEntityById
      tags:
        - Entities
      summary: Update an entity
      description: Replaces an entity while preserving the server-managed ID from the URL. The request ID may be omitted, null, or empty; a non-empty ID must match the URL.
      parameters:
        - $ref: "#/components/parameters/IsDraft"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          description: Entity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditedEntity"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEntityById
      tags:
        - Entities
      summary: Delete an entity
      responses:
        "204":
          description: Entity deleted
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      operationId: listUsers
      tags:
        - UserManagement
      summary: List users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - total
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      tags:
        - UserManagement
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWrite"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/users/invite:
    post:
      operationId: inviteUser
      tags:
        - UserInvites
      summary: Invite a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInviteWrite"
      responses:
        "201":
          description: User invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvite"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/users/invites:
    get:
      operationId: listUserInvites
      tags:
        - UserInvites
      summary: List pending users invites
      responses:
        "200":
          description: List of pending users invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInvite"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/users/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/InviteId"
    delete:
      operationId: revokeUserInviteById
      tags:
        - UserInvites
      summary: Revoke a user invite
      responses:
        "204":
          description: User invite revoked
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUserById
      tags:
        - UserManagement
      summary: Get a user
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceUserById
      tags:
        - UserManagement
      summary: Replace a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWrite"
      responses:
        "200":
          description: User replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: updateUserById
      tags:
        - UserManagement
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWrite"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUserById
      tags:
        - UserManagement
      summary: Delete a user
      responses:
        "204":
          description: User deleted
        "400":
          $ref: "#/components/responses/Error"

  /oauth/authorize:
    post:
      operationId: completeOauthAuthorization
      tags:
        - Oauth
      summary: Issue an OAuth authorization code for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthAuthorizeWrite"
      responses:
        "200":
          description: Authorization code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthAuthorizeResult"
        "400":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        OAuth 2.0 authorization code flow with PKCE. This is a public client:
        no client secret is required, so leave the Client Secret field blank.
        Access tokens are bearer JWTs.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes: { }
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string

    IsDraft:
      name: isDraft
      in: query
      required: false
      description: |
        Whether to save the entity as a draft, visible only to its creator and administrators, instead of publishing it. Defaults to false (publish).
        An already-published entity cannot be turned back into a draft; the parameter is ignored on update once the entity is published.
      schema:
        type: boolean
        default: false

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string

    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/InviteId"

    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string

  schemas:
    UserId:
      type: string
      format: email
      example: "jane.doe@example.com"

    InviteId:
      type: string
      pattern: "^idhi:invite:.+$"
      example: "idhi:invite:abc123"

    Date:
      type: string
      format: date-time
      description: UTC date and time

    FilterableField:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)*$"
      description: A dot-separated entity field path. Operators and array indexes are not allowed.

    FilterOperator:
      type: string
      enum:
        - eq
        - ne
        - gt
        - gte
        - lt
        - lte
        - in
        - nin
        - exists

    SortDirection:
      type: string
      description: Sort direction. Use `random` to return a random sample after filtering; the criterion property and any other sort criteria are ignored.
      enum:
        - asc
        - desc
        - random

    SortCriterion:
      type: object
      additionalProperties: false
      required:
        - property
        - direction
      properties:
        property:
          $ref: "#/components/schemas/FilterableField"
        direction:
          $ref: "#/components/schemas/SortDirection"

    Filter:
      $dynamicAnchor: filter
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - field
            - op
            - value
          properties:
            field:
              $ref: "#/components/schemas/FilterableField"
            op:
              $ref: "#/components/schemas/FilterOperator"
            value: { }
        - type: object
          additionalProperties: false
          required:
            - and
          properties:
            and:
              type: array
              minItems: 1
              items:
                $dynamicRef: "#filter"
        - type: object
          additionalProperties: false
          required:
            - or
          properties:
            or:
              type: array
              minItems: 1
              items:
                $dynamicRef: "#filter"

    EntitySearch:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          description: Optional free-text search query.
        facets:
          type: array
          description: Entity fields for which facet counts should be returned.
          maxItems: 100
          items:
            $ref: "#/components/schemas/FilterableField"
        filter:
          $ref: "#/components/schemas/Filter"
        sort:
          type: array
          minItems: 1
          description: Ordered property and direction pairs used to sort matching entities. When omitted, entities are sorted by audit.modifiedAt descending.
          items:
            $ref: "#/components/schemas/SortCriterion"
        page:
          type: integer
          minimum: 0
          default: 0
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

    AuthChallenge:
      type: object
      required:
        - challengeId
        - expiration
      properties:
        challengeId:
          type: string
        expiration:
          $ref: "#/components/schemas/Date"

    AuthToken:
      type: object
      required:
        - jwt
      properties:
        jwt:
          type: string
          description: JSON Web Token used as a bearer token

    OauthAuthorizeWrite:
      type: object
      required:
        - response_type
        - client_id
        - redirect_uri
        - code_challenge
        - code_challenge_method
      properties:
        response_type:
          type: string
          enum:
            - code
        client_id:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          format: uri
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9\\-._~]+$"
        code_challenge_method:
          type: string
          enum:
            - S256
        state:
          type: string
        scope:
          type: string
        resource:
          type: string

    OauthAuthorizeResult:
      type: object
      required:
        - redirectUrl
      properties:
        redirectUrl:
          type: string
          format: uri
          description: The client redirect URI with the authorization code and state attached

    AuthEmailWrite:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    UiLanguage:
      type: string
      enum:
        - en
        - he
        - ar

    AuthOtpStartWrite:
      allOf:
        - $ref: "#/components/schemas/AuthEmailWrite"
        - type: object
          properties:
            lang:
              $ref: "#/components/schemas/UiLanguage"

    AuthOtpChallenge:
      allOf:
        - $ref: "#/components/schemas/AuthChallenge"
        - type: object
          required:
            - digits
          properties:
            digits:
              type: integer
              minimum: 1
              maximum: 32
              description: Number of digits required to complete the OTP challenge.

    OtpChallengeCompletion:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string

    PasskeyRegistrationChallenge:
      allOf:
        - $ref: "#/components/schemas/AuthChallenge"
        - type: object
          required:
            - options
          properties:
            options:
              type: object
              additionalProperties: true
              description: Matches @simplewebauthn/PublicKeyCredentialCreationOptionsJSON.

    PasskeyRegistrationWrite:
      type: object
      additionalProperties: false
      properties:
        replacingCredentialId:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
          description: Existing credential to replace after successful registration.

    PasskeyRegistrationResponse:
      type: object
      additionalProperties: true
      description: Matches @simplewebauthn/RegistrationResponseJSON.

    PasskeyAuthenticationChallenge:
      allOf:
        - $ref: "#/components/schemas/AuthChallenge"
        - type: object
          required:
            - options
          properties:
            options:
              type: object
              additionalProperties: true
              description: Matches @simplewebauthn/PublicKeyCredentialRequestOptionsJSON.

    PasskeyAuthenticationResponse:
      type: object
      additionalProperties: true
      description: Matches @simplewebauthn/AuthenticationResponseJSON.

    Entity:
      oneOf:
        - $ref: "#/components/schemas/Person"
        - $ref: "#/components/schemas/Organization"
        - $ref: "#/components/schemas/Project"
        - $ref: "#/components/schemas/Tool"
        - $ref: "#/components/schemas/Service"
        - $ref: "#/components/schemas/Publication"
        - $ref: "#/components/schemas/Event"
        - $ref: "#/components/schemas/Dataset"
        - $ref: "#/components/schemas/TrainingMaterial"
      discriminator:
        propertyName: type
        mapping:
          "idhi:Person": "#/components/schemas/Person"
          "idhi:Organization": "#/components/schemas/Organization"
          "idhi:Project": "#/components/schemas/Project"
          "idhi:Tool": "#/components/schemas/Tool"
          "idhi:Service": "#/components/schemas/Service"
          "idhi:Publication": "#/components/schemas/Publication"
          "idhi:Event": "#/components/schemas/Event"
          "idhi:Dataset": "#/components/schemas/Dataset"
          "idhi:TrainingMaterial": "#/components/schemas/TrainingMaterial"

    Person:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Person"
      properties:
        id:
          type: string
          pattern: ^idhi:person:[0-9a-z]{4,12}$
          readOnly: true

    Organization:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Organization"
      properties:
        id:
          type: string
          pattern: ^idhi:organization:[0-9a-z]{4,12}$
          readOnly: true

    Project:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Project"
      properties:
        id:
          type: string
          pattern: ^idhi:project:[0-9a-z]{4,12}$
          readOnly: true

    Tool:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Tool"
      properties:
        id:
          type: string
          pattern: ^idhi:tool:[0-9a-z]{4,12}$
          readOnly: true

    Service:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Service"
      properties:
        id:
          type: string
          pattern: ^idhi:service:[0-9a-z]{4,12}$
          readOnly: true

    Publication:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Publication"
      properties:
        id:
          type: string
          pattern: ^idhi:publication:[0-9a-z]{4,12}$
          readOnly: true

    Event:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Event"
      properties:
        id:
          type: string
          pattern: ^idhi:event:[0-9a-z]{4,12}$
          readOnly: true

    Dataset:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/Dataset"
      properties:
        id:
          type: string
          pattern: ^idhi:dataset:[0-9a-z]{4,12}$
          readOnly: true

    TrainingMaterial:
      $ref: "https://raw.githubusercontent.com/DARIAH-IL/idhi-manifests/refs/heads/main/gen/idhi.schema.json#/$defs/TrainingMaterial"
      properties:
        id:
          type: string
          pattern: ^idhi:training_material:[0-9a-z]{4,12}$
          readOnly: true

    Audited:
      type: object
      properties:
        audit:
          type: object
          required:
            - createdAt
            - createdBy
            - modifiedAt
            - modifiedBy
          properties:
            createdAt:
              $ref: "#/components/schemas/Date"
            createdBy:
              $ref: "#/components/schemas/UserId"
            modifiedAt:
              $ref: "#/components/schemas/Date"
            modifiedBy:
              $ref: "#/components/schemas/UserId"

    AuditedEntity:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - $ref: "#/components/schemas/Audited"
        - type: object
          properties:
            isDraft:
              type: boolean
              description: Whether the entity is a draft, visible only to its creator and administrators.

    SuggestibleEntityField:
      type: string
      description: Entity fields that support AI-backed value suggestion.
      enum:
        - tags
        - digital_humanities_activities

    User:
      type: object
      required:
        - id
        - email
        - isAdmin
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean

    UserWrite:
      type: object
      required:
        - email
        - isAdmin
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean

    UserInvite:
      allOf:
        - $ref: "#/components/schemas/Audited"
        - type: object
          required:
            - id
            - email
            - expiration
          properties:
            id:
              $ref: "#/components/schemas/InviteId"
            email:
              type: string
              format: email
            message:
              type: string
            expiration:
              $ref: "#/components/schemas/Date"

    UserInviteWrite:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        message:
          type: string
        expiryDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        lang:
          $ref: "#/components/schemas/UiLanguage"

    ErrorCode:
      type: string
      enum:
        - Unauthorized
        - InvalidInput
        - InternalServerError
        - EntityNotFound
        - EntityReferenced
        - UserNotFound
        - UserAlreadyInvitedOrRegistered
        - WrongOtpCode
        - TooManyAuthAttempts
        - AuthChallengeNotFoundOrExpired
        - AiSuggestionFailed
        - AiSuggestionsLimitReached

    Error:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        entityId:
          type: string

  responses:
    Error:
      description: Applicative error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
