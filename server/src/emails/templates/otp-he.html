<!doctype html>
<html lang="he" dir="rtl">
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f5; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td align="center" style="padding: 40px 32px 8px">
                <img
                  src="https://idhi.pages.dev/logo.png"
                  alt="IDHI"
                  width="72"
                  style="display: block; margin: 0 auto 16px"
                />
                <div style="font-size: 16px; font-weight: 600; color: #18181b">
                  IDHI
                </div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 24px 32px 8px">
                <p
                  style="
                    margin: 0 0 20px;
                    font-size: 14px;
                    line-height: 1.5;
                    color: #52525b;
                    text-align: center;
                  "
                >
                  קוד ההתחברות שלך ל-IDHI הוא:
                </p>
                <div
                  style="
                    display: inline-block;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: 8px;
                    color: #18181b;
                    background-color: #f4f4f5;
                    border-radius: 8px;
                    padding: 14px 24px;
                    margin-bottom: 20px;
                  "
                >
                  {{otp}}
                </div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 8px 32px 32px">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      align="center"
                      style="border-radius: 8px; background-color: #18181b"
                    >
                      <a
                        href="{{loginUrl}}"
                        style="
                          display: inline-block;
                          padding: 12px 28px;
                          font-size: 14px;
                          font-weight: 600;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 8px;
                        "
                        >או לחצו כאן להתחברות ישירה</a
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 20px 0 0;
                    font-size: 12px;
                    color: #a1a1aa;
                    text-align: center;
                  "
                >
                  הקוד יפוג בתאריך {{expiration}}.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
